services:
  metrogenn:
    build:
      context: .
    image: metrogenn:local
    container_name: metrogenn
    init: true
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      TORCH_HOME: /cache/torch
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./train:/app/train:ro
      - ./models:/app/models
      - ./saved_results:/app/saved_results
    command: ["/bin/sh", "-lc", "${METROGNN_COMMAND:-python scripts/run_inference.py}"]
